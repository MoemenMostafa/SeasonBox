name: Deploy Website to Firebase Hosting

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'website/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode Firebase service account key
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" | base64 --decode > firebase-service-account.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: firebase-service-account.json
          channelId: live
          projectId: seasonbox-f4b24
        env:
          FIREBASE_CLI_PREV: 1

      - name: Clean up service account
        if: always()
        run: rm -f firebase-service-account.json
