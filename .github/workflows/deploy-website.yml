name: Deploy Website to Firebase Hosting
run-name: Deploying Website - ${{ github.ref_name }} (${{ github.sha }})

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          # Decode service account key
          echo "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > ${{ github.workspace }}/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/firebase-service-account.json
          
          # Deploy hosting
          firebase deploy --only hosting --project seasonbox-f4b24

      - name: Clean up service account
        if: always()
        run: rm -f ${{ github.workspace }}/firebase-service-account.json
