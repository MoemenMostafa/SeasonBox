name: Deploy Website to Firebase Hosting
run-name: Deploying Website - ${{ github.ref_name }} (${{ github.sha }})

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode Firebase service account key
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" | base64 --decode > ${{ github.workspace }}/firebase-service-account.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ github.workspace }}/firebase-service-account.json
          channelId: live
          projectId: seasonbox-f4b24
        env:
          FIREBASE_CLI_PREV: 1

      - name: Clean up service account
        if: always()
        run: rm -f ${{ github.workspace }}/firebase-service-account.json
