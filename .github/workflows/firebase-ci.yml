name: Firebase CI
run-name: Firebase CI - ${{ github.ref_name }} (${{ github.sha }})

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firestore-tests/**'
      - 'functions/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firestore-tests/**'
      - 'functions/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test-firestore:
    name: Run Firestore Rules Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Cache Firestore Emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firestore-emulator-${{ hashFiles('~/.cache/firebase/emulators/*.jar') }}
          restore-keys: |
            ${{ runner.os }}-firestore-emulator-

      - name: Install dependencies
        working-directory: firestore-tests
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore tests in Emulator
        run: firebase emulators:exec --only firestore "cd ${{ github.workspace }}/firestore-tests && npm test"

  test-functions:
    name: Run Functions Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Run Lint
        working-directory: functions
        run: npm run lint

  deploy:
    name: Deploy to Firebase
    needs: [test-firestore, test-functions]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: Deploy Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FUNCTIONS_CONFIG_EXPORT: ${{ secrets.FUNCTIONS_CONFIG_EXPORT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_KEY secret not set"
            exit 1
          fi
          
          # Decode service account key
          echo "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > ${{ github.workspace }}/service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/service-account.json
          
          # Deploy firestore and functions
          # Note: secrets must be set in the environment for functions that require them
          firebase deploy --only firestore,functions --project seasonbox-f4b24
          
          # Clean up
          rm ${{ github.workspace }}/service-account.json
