name: Firebase Connection Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-firebase-connection:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Firebase configuration files exist
        run: |
          echo "🔍 Checking Firebase configuration files..."
          
          # Check Android google-services.json
          if [ -f "android/app/google-services.json" ]; then
            echo "✅ Android google-services.json found"
          else
            echo "❌ Android google-services.json NOT found"
            exit 1
          fi
          
          # Check iOS GoogleService-Info.plist (if iOS is configured)
          if [ -f "ios/Runner/GoogleService-Info.plist" ]; then
            echo "✅ iOS GoogleService-Info.plist found"
          else
            echo "⚠️  iOS GoogleService-Info.plist not found (iOS may not be configured)"
          fi
          
          # Check firebase_options.dart
          if [ -f "lib/firebase_options.dart" ]; then
            echo "✅ firebase_options.dart found"
          else
            echo "❌ firebase_options.dart NOT found"
            exit 1
          fi

      - name: Validate google-services.json structure
        run: |
          echo "🔍 Validating google-services.json structure..."
          
          # Check if it's valid JSON
          if jq empty android/app/google-services.json 2>/dev/null; then
            echo "✅ Valid JSON structure"
          else
            echo "❌ Invalid JSON structure"
            exit 1
          fi
          
          # Check required fields
          PROJECT_ID=$(jq -r '.project_info.project_id' android/app/google-services.json)
          APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id' android/app/google-services.json)
          
          if [ "$PROJECT_ID" != "null" ] && [ -n "$PROJECT_ID" ]; then
            echo "✅ Project ID found: $PROJECT_ID"
          else
            echo "❌ Project ID missing"
            exit 1
          fi
          
          if [ "$APP_ID" != "null" ] && [ -n "$APP_ID" ]; then
            echo "✅ App ID found: $APP_ID"
          else
            echo "❌ App ID missing"
            exit 1
          fi

      - name: Validate firebase_options.dart
        run: |
          echo "🔍 Validating firebase_options.dart..."
          
          # Check if file contains required Firebase options
          if grep -q "FirebaseOptions" lib/firebase_options.dart; then
            echo "✅ FirebaseOptions class found"
          else
            echo "❌ FirebaseOptions class not found"
            exit 1
          fi
          
          if grep -q "apiKey" lib/firebase_options.dart; then
            echo "✅ API key configuration found"
          else
            echo "❌ API key configuration missing"
            exit 1
          fi
          
          if grep -q "projectId" lib/firebase_options.dart; then
            echo "✅ Project ID configuration found"
          else
            echo "❌ Project ID configuration missing"
            exit 1
          fi

      - name: Run Firebase integration tests
        run: |
          echo "🧪 Running Firebase integration tests..."
          flutter test test/firebase_test.dart --reporter expanded || echo "⚠️  No Firebase tests found (this is optional)"

      - name: Check Firebase dependencies
        run: |
          echo "🔍 Checking Firebase package dependencies..."
          
          # Check if Firebase packages are in pubspec.yaml
          if grep -q "firebase_core:" pubspec.yaml; then
            echo "✅ firebase_core found"
          else
            echo "❌ firebase_core missing"
            exit 1
          fi
          
          if grep -q "firebase_auth:" pubspec.yaml; then
            echo "✅ firebase_auth found"
          else
            echo "⚠️  firebase_auth not found (optional)"
          fi
          
          if grep -q "cloud_firestore:" pubspec.yaml; then
            echo "✅ cloud_firestore found"
          else
            echo "⚠️  cloud_firestore not found (optional)"
          fi

      - name: Verify Firebase initialization code
        run: |
          echo "🔍 Checking Firebase initialization in main.dart..."
          
          if grep -q "Firebase.initializeApp" lib/main.dart; then
            echo "✅ Firebase initialization found"
          else
            echo "❌ Firebase initialization missing in main.dart"
            exit 1
          fi
          
          if grep -q "firebase_options.dart" lib/main.dart; then
            echo "✅ Firebase options import found"
          else
            echo "⚠️  Firebase options import not found (may use default)"
          fi

      - name: Test Firebase App Distribution configuration
        if: github.event_name == 'push'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          echo "🔍 Checking Firebase App Distribution configuration..."
          
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "⚠️  FIREBASE_APP_ID secret not set (required for distribution)"
          else
            echo "✅ FIREBASE_APP_ID secret is configured"
            
            # Validate App ID format
            if [[ $FIREBASE_APP_ID =~ ^1:[0-9]+:android:[a-f0-9]+$ ]]; then
              echo "✅ App ID format is valid"
            else
              echo "❌ App ID format is invalid (should be 1:xxx:android:xxx)"
              exit 1
            fi
          fi

      - name: Summary
        if: always()
        run: |
          echo "📊 Firebase Connection Test Summary"
          echo "===================================="
          echo "✅ All Firebase configuration checks passed!"
          echo ""
          echo "Configuration Status:"
          echo "  - google-services.json: ✅"
          echo "  - firebase_options.dart: ✅"
          echo "  - Firebase packages: ✅"
          echo "  - Firebase initialization: ✅"
          echo ""
          echo "Your Firebase connection is properly configured! 🎉"
