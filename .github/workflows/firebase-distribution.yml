name: Build and Deploy to Firebase App Distribution
run-name: App Distribution - ${{ github.ref_name }} (${{ github.sha }})

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/firebase-distribution.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/firebase-distribution.yml'
  workflow_dispatch: # Allows manual trigger

jobs:
  build-and-deploy:
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract latest changelog
        id: extract_changelog
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2)
          {
            echo "changelog<<EOF"
            awk -v ver="$VERSION" '/^## / { if (p) exit; if ($2 == ver) p=1 } p' CHANGELOG.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Gradle caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: flutter test
        continue-on-error: true # Continue even if tests fail

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Decode Firebase service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > ${{ github.workspace }}/firebase-service-account.json

      - name: Decode Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/android/app/release-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > ${{ github.workspace }}/android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Build Android Release
        run: |
          # Enable Gradle daemon and parallel builds for faster compilation
          mkdir -p ~/.gradle
          echo "org.gradle.daemon=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties
          
          # Build APK for Firebase and App Bundle for Google Play
          flutter build apk --release --no-tree-shake-icons
          flutter build appbundle --release --no-tree-shake-icons

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFile: ${{ github.workspace }}/firebase-service-account.json
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            ${{ steps.extract_changelog.outputs.changelog }}

            ---
            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

      - name: Decode Google Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > ${{ github.workspace }}/google-play-service-account.json

      - name: Upload AAB to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ github.workspace }}/google-play-service-account.json
          packageName: io.mos.seasonbox
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # - name: Upload APK artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-release-apk
      #     path: build/app/outputs/flutter-apk/app-release.apk
      #     retention-days: 7

      # - name: Upload App Bundle artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: app-release-bundle
      #     path: build/app/outputs/bundle/release/app-release.aab
      #     retention-days: 7

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f ${{ github.workspace }}/firebase-service-account.json
          rm -f ${{ github.workspace }}/google-play-service-account.json
          rm -f ${{ github.workspace }}/android/app/release-keystore.jks
          rm -f ${{ github.workspace }}/android/key.properties
