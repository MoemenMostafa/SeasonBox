name: Firestore CI

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firestore-tests/**'
      - '.github/workflows/firestore-ci.yml'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firestore-tests/**'
      - '.github/workflows/firestore-ci.yml'
  workflow_dispatch:

jobs:
  test-firestore:
    name: Run Firestore Rules Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Cache Firestore Emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firestore-emulator-${{ hashFiles('~/.cache/firebase/emulators/*.jar') }}
          restore-keys: |
            ${{ runner.os }}-firestore-emulator-

      - name: Install dependencies
        working-directory: firestore-tests
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore tests in Emulator
        run: firebase emulators:exec --only firestore "cd firestore-tests && npm test"

  deploy-firestore:
    name: Deploy Firestore Rules and Indexes
    needs: test-firestore
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_KEY secret not set"
            exit 1
          fi
          
          # Decode service account key
          echo "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          
          # Deploy rules and indexes
          firebase deploy --only firestore --project seasonbox-f4b24
          
          # Clean up
          rm service-account.json
